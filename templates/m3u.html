{% extends "base.html" %}
{% block content %}

<div class="mb-8">
    <h1 class="text-3xl font-bold text-white flex items-center gap-3">
        <i data-lucide="upload-cloud" class="text-blue-500"></i> Atualizar M3U
    </h1>
    <p class="text-slate-400 mt-2">Faça o upload do seu arquivo de lista M3U (dados.txt).</p>
</div>

<div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 md:p-10 max-w-2xl mx-auto shadow-2xl">

    <div id="uploadArea"
        class="border-2 border-dashed border-slate-700 rounded-2xl p-10 flex flex-col items-center justify-center text-center hover:border-blue-500 hover:bg-blue-900/10 transition-colors cursor-pointer"
        onclick="document.getElementById('m3uFile').click()">
        <i data-lucide="file-text" class="w-16 h-16 text-slate-500 mb-4"></i>
        <h3 class="text-xl font-bold text-white mb-2">Selecione o arquivo</h3>
        <p class="text-sm text-slate-400">Clique aqui para enviar (.txt ou .m3u)</p>

        <input type="file" id="m3uFile" accept=".txt,.m3u" class="hidden" onchange="handleFileSelect(event)">
    </div>

    <div id="fileInfo"
        class="hidden mt-6 bg-[#0b0f1a] rounded-xl p-4 border border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <i data-lucide="file-check" class="w-8 h-8 text-emerald-500"></i>
            <div class="text-left">
                <p id="fileName" class="text-white font-bold text-sm">arquivo.txt</p>
                <p id="fileSize" class="text-slate-500 text-xs">0 MB</p>
            </div>
        </div>
        <button onclick="resetFile()" class="p-2 text-slate-400 hover:text-red-400 transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>

    <div id="progressContainer" class="hidden mt-6 bg-[#0b0f1a] rounded-xl p-4 border border-slate-800">
        <div class="flex justify-between text-xs font-bold text-slate-400 mb-2">
            <span id="progressText">Enviando...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
            <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
        </div>
    </div>

    <div class="mt-8 flex justify-end">
        <button id="uploadBtn" onclick="uploadFile()" disabled
            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold px-8 py-3 rounded-xl transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98]">
            <i data-lucide="upload" class="w-5 h-5"></i>
            Processar e Indexar
        </button>
    </div>

    <div id="statusMsg" class="mt-6 hidden p-4 rounded-xl text-sm font-bold border"></div>
</div>

<script>
    let selectedFile = null;

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        selectedFile = file;

        document.getElementById('uploadArea').classList.add('hidden');
        document.getElementById('fileInfo').classList.remove('hidden');
        document.getElementById('uploadBtn').disabled = false;

        document.getElementById('fileName').innerText = file.name;
        document.getElementById('fileSize').innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function resetFile() {
        selectedFile = null;
        document.getElementById('m3uFile').value = '';
        document.getElementById('uploadArea').classList.remove('hidden');
        document.getElementById('fileInfo').classList.add('hidden');
        document.getElementById('uploadBtn').disabled = true;
        document.getElementById('statusMsg').classList.add('hidden');
    }

    function uploadFile() {
        if (!selectedFile) return;

        const btn = document.getElementById('uploadBtn');
        const status = document.getElementById('statusMsg');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');

        btn.disabled = true;
        btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Preparando...';
        lucide.createIcons();

        status.classList.add('hidden');
        progressContainer.classList.remove('hidden');
        progressBar.style.width = '0%';
        progressBar.classList.remove('bg-emerald-500');
        progressBar.classList.add('bg-blue-600');
        progressPercent.innerText = '0%';
        progressText.innerText = 'Fazendo upload do arquivo...';

        const formData = new FormData();
        formData.append('file', selectedFile);

        const xhr = new XMLHttpRequest();

        // Rastrear progresso do upload
        xhr.upload.addEventListener("progress", function (e) {
            if (e.lengthComputable) {
                const percentComplete = (e.loaded / e.total) * 100;
                progressBar.style.width = percentComplete + '%';
                progressPercent.innerText = Math.round(percentComplete) + '%';

                if (percentComplete === 100) {
                    progressText.innerText = 'Upload concluído! Indexando dados no banco... aguarde (isso pode demorar uns segundos).';
                    progressBar.classList.replace('bg-blue-600', 'bg-amber-500');
                    btn.innerHTML = '<i data-lucide="database" class="w-5 h-5 animate-bounce"></i> Processando Indexação...';
                    lucide.createIcons();
                }
            }
        });

        // Quando a requisição termina
        xhr.addEventListener("load", function () {
            status.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/20', 'text-red-500');

            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const data = JSON.parse(xhr.responseText);

                    if (data.error) throw new Error(data.error);

                    progressText.innerText = 'Indexação finalizada!';
                    progressBar.classList.replace('bg-amber-500', 'bg-emerald-500');

                    status.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-500');
                    status.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 inline mr-2"></i> Sucesso! Base atualizada. Filmes: ${data.stats.filmes} | Séries: ${data.stats.series} | Tempo: ${data.stats.index_time}s`;

                    setTimeout(() => {
                        resetFile();
                        progressContainer.classList.add('hidden');
                    }, 5000);

                } catch (err) {
                    showError(err.message || 'Erro inesperado ao ler resposta do servidor.');
                }
            } else {
                showError(`Erro no servidor: ${xhr.status}`);
            }
            lucide.createIcons();
        });

        xhr.addEventListener("error", function () {
            showError("Falha na conexão de rede. Verifique sua internet.");
        });

        xhr.open("POST", "/api/upload_m3u");
        xhr.send(formData);

        function showError(msg) {
            status.classList.remove('hidden');
            status.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-500');
            status.innerText = msg;
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="upload" class="w-5 h-5"></i> Tentar Novamente';
            progressContainer.classList.add('hidden');
            lucide.createIcons();
        }
    }
</script>

{% endblock %}
