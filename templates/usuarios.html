{% extends "base.html" %}
{% block content %}

<div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
        <h1 class="text-3xl font-bold text-white flex items-center gap-3">
            <i data-lucide="users" class="text-blue-500"></i> Gerenciar Usuários
        </h1>
        <p class="text-slate-400">Crie, edite e gerencie os acessos ao sistema.</p>
    </div>
    <button onclick="openCreate()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98]">
        <i data-lucide="user-plus" class="w-5 h-5"></i> Novo Usuário
    </button>
</div>

<div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-[#0b0f1a] border-b border-slate-800">
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold">ID</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold">Usuário</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold">Papel</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold">Status</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold hidden lg:table-cell">Criado em</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold text-center">Ações</th>
                </tr>
            </thead>
            <tbody id="usersTable" class="divide-y divide-slate-800 text-sm">
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Criar Usuário -->
<div id="createModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="user-plus" class="text-blue-500 w-5 h-5"></i> Novo Usuário
            </h2>
            <button onclick="closeCreate()" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Nome de Usuário</label>
                <input type="text" id="newUsername" placeholder="Ex: joao.silva"
                    class="w-full bg-[#0b0f1a] border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Senha</label>
                <input type="password" id="newPassword" placeholder="Mínimo 3 caracteres"
                    class="w-full bg-[#0b0f1a] border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Papel</label>
                <select id="newRole"
                    class="w-full bg-[#0b0f1a] border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="user">Usuário</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>
        </div>

        <div class="p-6 border-t border-slate-800 flex gap-3">
            <button onclick="closeCreate()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all">
                Cancelar
            </button>
            <button onclick="submitCreate()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/20">
                Criar Usuário
            </button>
        </div>
    </div>
</div>

<!-- Modal Alterar Senha -->
<div id="passwordModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#111827] border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="key" class="text-amber-500 w-5 h-5"></i> Alterar Senha
            </h2>
            <button onclick="closePassword()" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="p-6">
            <p id="passwordUserLabel" class="text-sm text-slate-400 mb-4"></p>
            <input type="password" id="newUserPassword" placeholder="Nova senha..."
                class="w-full bg-[#0b0f1a] border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <div class="p-6 border-t border-slate-800 flex gap-3">
            <button onclick="closePassword()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl transition-all">
                Cancelar
            </button>
            <button onclick="submitPassword()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition-all">
                Salvar Senha
            </button>
        </div>
    </div>
</div>

<style>
    .badge-admin { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
    .badge-user { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
    .badge-ativo { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
    .badge-inativo { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    .badge {
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    .action-btn {
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        transition: all 0.2s;
        border: 1px solid transparent;
        cursor: pointer;
    }
</style>

<script>
let editingUserId = null;

function loadUsers() {
    fetch("/api/users")
        .then(res => res.json())
        .then(data => {
            const table = document.getElementById("usersTable");
            table.innerHTML = "";

            data.forEach(user => {
                const row = document.createElement("tr");
                row.className = "hover:bg-slate-800/30 transition-colors";

                const roleBadge = user.role === "admin"
                    ? `<span class="badge badge-admin"><i data-lucide="shield" class="w-3 h-3"></i> Admin</span>`
                    : `<span class="badge badge-user"><i data-lucide="user" class="w-3 h-3"></i> User</span>`;

                const statusBadge = user.ativo
                    ? `<span class="badge badge-ativo">Ativo</span>`
                    : `<span class="badge badge-inativo">Inativo</span>`;

                const toggleLabel = user.ativo ? "Desativar" : "Ativar";
                const toggleColor = user.ativo ? "text-red-400 hover:bg-red-500/10" : "text-emerald-400 hover:bg-emerald-500/10";
                const newRole = user.role === "admin" ? "user" : "admin";
                const roleLabel = user.role === "admin" ? "→ User" : "→ Admin";

                row.innerHTML = `
                    <td class="p-4 font-mono text-slate-500">${user.id}</td>
                    <td class="p-4">
                        <span class="font-bold text-white">${user.username}</span>
                    </td>
                    <td class="p-4">${roleBadge}</td>
                    <td class="p-4">${statusBadge}</td>
                    <td class="p-4 hidden lg:table-cell text-slate-500 text-xs italic">${user.created_at || '—'}</td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-1 flex-wrap">
                            <button onclick="changeRole(${user.id}, '${newRole}')"
                                class="action-btn text-blue-400 hover:bg-blue-500/10" title="Mudar papel">
                                <i data-lucide="repeat" class="w-3 h-3 inline"></i> ${roleLabel}
                            </button>
                            <button onclick="openPassword(${user.id}, '${user.username}')"
                                class="action-btn text-amber-400 hover:bg-amber-500/10" title="Alterar senha">
                                <i data-lucide="key" class="w-3 h-3 inline"></i>
                            </button>
                            <button onclick="toggleUser(${user.id})"
                                class="action-btn ${toggleColor}" title="${toggleLabel}">
                                <i data-lucide="power" class="w-3 h-3 inline"></i>
                            </button>
                            <button onclick="deleteUser(${user.id}, '${user.username}')"
                                class="action-btn text-red-400 hover:bg-red-500/10" title="Excluir">
                                <i data-lucide="trash-2" class="w-3 h-3 inline"></i>
                            </button>
                        </div>
                    </td>
                `;

                table.appendChild(row);
            });

            lucide.createIcons();
        });
}

// ─── CREATE ─────────────────
function openCreate() {
    document.getElementById("createModal").classList.remove("hidden");
    document.getElementById("newUsername").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("newRole").value = "user";
    lucide.createIcons();
}

function closeCreate() {
    document.getElementById("createModal").classList.add("hidden");
}

function submitCreate() {
    const username = document.getElementById("newUsername").value.trim();
    const password = document.getElementById("newPassword").value;
    const role = document.getElementById("newRole").value;

    if (!username || !password) {
        alert("Preencha usuário e senha!");
        return;
    }

    fetch("/api/users", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password, role })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
        } else {
            closeCreate();
            loadUsers();
        }
    });
}

// ─── ROLE ───────────────────
function changeRole(id, newRole) {
    fetch(`/api/users/${id}/role`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ role: newRole })
    }).then(() => loadUsers());
}

// ─── TOGGLE ─────────────────
function toggleUser(id) {
    fetch(`/api/users/${id}/toggle`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        if (data.error) alert(data.error);
        loadUsers();
    });
}

// ─── PASSWORD ───────────────
function openPassword(id, username) {
    editingUserId = id;
    document.getElementById("passwordUserLabel").innerText = `Alterando senha de: ${username}`;
    document.getElementById("newUserPassword").value = "";
    document.getElementById("passwordModal").classList.remove("hidden");
    lucide.createIcons();
}

function closePassword() {
    document.getElementById("passwordModal").classList.add("hidden");
    editingUserId = null;
}

function submitPassword() {
    const password = document.getElementById("newUserPassword").value;
    if (!password || password.length < 3) {
        alert("Senha deve ter pelo menos 3 caracteres!");
        return;
    }

    fetch(`/api/users/${editingUserId}/password`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) alert(data.error);
        closePassword();
    });
}

// ─── DELETE ─────────────────
function deleteUser(id, username) {
    if (!confirm(`Tem certeza que deseja EXCLUIR o usuário "${username}"? Esta ação é irreversível!`)) return;

    fetch(`/api/users/${id}/delete`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        if (data.error) alert(data.error);
        loadUsers();
    });
}

// Init
loadUsers();
lucide.createIcons();
</script>

{% endblock %}
