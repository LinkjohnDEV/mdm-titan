{% extends "base.html" %}
{% block content %}

<style>
  .tab-btn { transition: all .2s; }
  .tab-btn.active { background: #1e293b; color: #fff; border-color: #3b82f6; }
  .tab-btn:not(.active) { color: #94a3b8; }

  .badge-feat     { background: #1d4ed8/20; color: #93c5fd; border-color: #1d4ed8/40; }
  .badge-fix      { background: #92400e/20; color: #fcd34d; border-color: #92400e/40; }
  .badge-security { background: #7f1d1d/20; color: #fca5a5; border-color: #7f1d1d/40; }
  .badge-chore    { background: #1e293b;    color: #94a3b8; border-color: #334155;    }

  .pri-critica { color: #f87171; }
  .pri-alta    { color: #fb923c; }
  .pri-media   { color: #fbbf24; }
  .pri-baixa   { color: #94a3b8; }

  .status-chip {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 999px; border: 1px solid;
  }
  .s-planejado       { color: #94a3b8; border-color: #334155; }
  .s-em-desenvolvimento { color: #60a5fa; border-color: #1d4ed8/50; }
  .s-testando        { color: #34d399; border-color: #065f46/50; }
  .s-bloqueado       { color: #f87171; border-color: #7f1d1d/50; }
</style>

<!-- Header -->
<div class="mb-8 flex items-start justify-between">
  <div>
    <h1 class="text-3xl font-bold text-white flex items-center gap-3">
      <i data-lucide="megaphone" class="text-blue-500 w-8 h-8"></i> Updates
    </h1>
    <p class="text-slate-400 mt-1">O que foi entregue e o que está na fila.</p>
  </div>
</div>

<!-- Tabs -->
<div class="flex gap-2 mb-6">
  <button id="tab-updates" onclick="switchTab('updates')"
    class="tab-btn active px-5 py-2 rounded-xl border border-transparent text-sm font-bold flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4"></i> Updates
  </button>
  <button id="tab-embreve" onclick="switchTab('embreve')"
    class="tab-btn px-5 py-2 rounded-xl border border-transparent text-sm font-bold flex items-center gap-2">
    <i data-lucide="clock" class="w-4 h-4"></i> Em breve
    <span id="badge-pendente"
      class="hidden bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full min-w-[20px] text-center">0</span>
  </button>
</div>

<!-- Painel: Updates (entregue) -->
<div id="painel-updates">
  <div id="updates-list" class="space-y-6">
    <div class="text-center py-16 text-slate-500">
      <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
      Carregando…
    </div>
  </div>
</div>

<!-- Painel: Em breve (pendente) -->
<div id="painel-embreve" class="hidden">

  <!-- Botão novo -->
  <div class="flex justify-end mb-4">
    <button onclick="abrirModal()"
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2 rounded-xl transition">
      <i data-lucide="plus" class="w-4 h-4"></i> Novo item
    </button>
  </div>

  <div id="embreve-list" class="space-y-3">
    <div class="text-center py-16 text-slate-500">
      <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>
      Carregando…
    </div>
  </div>
</div>

<!-- ── Modal novo item ────────────────────────────────────── -->
<div id="modal-novo" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 hidden">
  <div class="bg-[#0f172a] border border-slate-700 rounded-2xl p-6 w-full max-w-lg mx-4 space-y-4">
    <h2 class="text-lg font-bold text-white flex items-center gap-2">
      <i data-lucide="plus-circle" class="w-5 h-5 text-blue-400"></i> Novo item — Em breve
    </h2>

    <div>
      <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Título *</label>
      <input id="f-titulo" type="text" placeholder="Nome curto do que será feito"
        class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm">
    </div>

    <div>
      <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Descrição</label>
      <textarea id="f-descricao" rows="4" placeholder="O quê muda, por quê e o risco envolvido…"
        class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm resize-none"></textarea>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Categoria</label>
        <select id="f-area" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
          <option value="feat">feat</option>
          <option value="fix">fix</option>
          <option value="security">security</option>
          <option value="chore">chore</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Prioridade</label>
        <select id="f-prioridade" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
          <option value="critica">🔴 Crítica</option>
          <option value="alta">🟠 Alta</option>
          <option value="media" selected>🟡 Média</option>
          <option value="baixa">⚪ Baixa</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Status</label>
        <select id="f-status" class="mt-1 w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
          <option value="planejado">Planejado</option>
          <option value="em-desenvolvimento">Em dev</option>
          <option value="testando">Testando</option>
          <option value="bloqueado">Bloqueado</option>
        </select>
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button onclick="fecharModal()"
        class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-sm transition">
        Cancelar
      </button>
      <button onclick="salvarItem()"
        class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-sm transition">
        Salvar
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="mdm-toast"
  class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl border text-sm font-semibold pointer-events-none"
  style="opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease"></div>

<script>
  const AREA_COLORS = {
    feat:     'bg-blue-500/10 text-blue-300 border-blue-500/30',
    fix:      'bg-yellow-500/10 text-yellow-300 border-yellow-500/30',
    security: 'bg-red-500/10 text-red-300 border-red-500/30',
    chore:    'bg-slate-700 text-slate-400 border-slate-600',
  };
  const PRI_ICON = { critica:'🔴', alta:'🟠', media:'🟡', baixa:'⚪' };
  const STATUS_LABEL = {
    'planejado':'Planejado',
    'em-desenvolvimento':'Em desenvolvimento',
    'testando':'Testando',
    'bloqueado':'Bloqueado',
  };
  const STATUS_CLS = {
    'planejado':'s-planejado',
    'em-desenvolvimento':'s-em-desenvolvimento',
    'testando':'s-testando',
    'bloqueado':'s-bloqueado',
  };
  const PRI_ORDER = { critica:0, alta:1, media:2, baixa:3 };

  let tabAtual = 'updates';

  // ── tabs ──────────────────────────────────────────────
  function switchTab(tab) {
    tabAtual = tab;
    document.getElementById('painel-updates').classList.toggle('hidden', tab !== 'updates');
    document.getElementById('painel-embreve').classList.toggle('hidden', tab !== 'embreve');
    document.getElementById('tab-updates').classList.toggle('active', tab === 'updates');
    document.getElementById('tab-embreve').classList.toggle('active', tab === 'embreve');
    if (tab === 'updates') carregarUpdates();
    else carregarEmBreve();
  }

  // ── toast ─────────────────────────────────────────────
  function showToast(msg, ok = true) {
    const t = document.getElementById('mdm-toast');
    t.textContent = msg;
    t.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl border text-sm font-semibold pointer-events-none ${ok ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-red-500/10 text-red-400 border-red-500/30'}`;
    t.style.opacity = '1'; t.style.transform = 'translateY(0)';
    setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(10px)'; }, 3000);
  }

  // ── helpers ───────────────────────────────────────────
  function badgeArea(area) {
    const cls = AREA_COLORS[area] || AREA_COLORS.chore;
    return `<span class="inline-flex items-center px-2 py-0.5 rounded-full border text-[10px] font-bold uppercase tracking-wide ${cls}">${area}</span>`;
  }
  function fmtData(d) {
    if (!d) return '';
    const [y, m, day] = d.split('-');
    return `${day}/${m}/${y}`;
  }

  // ── UPDATES (entregues) ───────────────────────────────
  async function carregarUpdates() {
    const el = document.getElementById('updates-list');
    el.innerHTML = '<div class="text-center py-16 text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Carregando…</div>';
    lucide.createIcons();
    const res = await fetch('/api/updates?estado=entregue');
    const items = await res.json();
    if (!items.length) {
      el.innerHTML = '<div class="text-center py-16 text-slate-500 text-sm">Nenhum update ainda.</div>';
      return;
    }
    // agrupar por data
    const grupos = {};
    items.forEach(u => {
      if (!grupos[u.data]) grupos[u.data] = [];
      grupos[u.data].push(u);
    });
    el.innerHTML = Object.entries(grupos).map(([data, arr]) => `
      <div>
        <div class="flex items-center gap-3 mb-3">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">${fmtData(data)}</span>
          <span class="text-[10px] font-bold text-slate-600">· ${arr.length} update${arr.length>1?'s':''}</span>
          <div class="flex-1 border-t border-slate-800"></div>
        </div>
        <div class="space-y-3">
          ${arr.map(u => `
            <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl px-5 py-4">
              <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                  <div class="flex flex-wrap items-center gap-2 mb-1">
                    ${badgeArea(u.area || 'chore')}
                    <span class="text-white font-bold text-sm">${u.titulo}</span>
                  </div>
                  ${u.descricao ? `<p class="text-slate-400 text-sm mt-1 leading-relaxed">${u.descricao}</p>` : ''}
                </div>
                <span class="text-[11px] text-slate-600 whitespace-nowrap pt-0.5">${u.hora || ''}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  // ── EM BREVE (pendentes) ──────────────────────────────
  async function carregarEmBreve() {
    const el = document.getElementById('embreve-list');
    el.innerHTML = '<div class="text-center py-16 text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Carregando…</div>';
    lucide.createIcons();
    const res = await fetch('/api/updates?estado=pendente');
    let items = await res.json();
    // atualiza badge
    const badge = document.getElementById('badge-pendente');
    if (items.length) { badge.textContent = items.length; badge.classList.remove('hidden'); }
    else { badge.classList.add('hidden'); }
    if (!items.length) {
      el.innerHTML = '<div class="text-center py-16 text-slate-500 text-sm">Fila vazia — tudo entregue 🎉</div>';
      return;
    }
    // ordenar por prioridade
    items.sort((a, b) => (PRI_ORDER[a.prioridade]||2) - (PRI_ORDER[b.prioridade]||2));
    el.innerHTML = items.map(u => `
      <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl px-5 py-4" id="item-${u.id}">
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              ${badgeArea(u.area || 'chore')}
              <span class="text-white font-bold text-sm">${u.titulo}</span>
              <span class="text-base leading-none" title="${u.prioridade}">${PRI_ICON[u.prioridade]||'🟡'}</span>
              <span class="status-chip ${STATUS_CLS[u.status_dev]||'s-planejado'}">${STATUS_LABEL[u.status_dev]||u.status_dev}</span>
            </div>
            ${u.descricao ? `<p class="text-slate-400 text-sm mt-1 leading-relaxed">${u.descricao}</p>` : ''}
          </div>
          <div class="flex flex-col gap-2 shrink-0">
            <button onclick="entregar(${u.id})"
              class="flex items-center gap-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-3 py-1.5 rounded-lg transition whitespace-nowrap">
              🚀 Entregar
            </button>
            <button onclick="removerItem(${u.id})"
              class="flex items-center gap-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold px-3 py-1.5 rounded-lg transition whitespace-nowrap">
              🗑️ Remover
            </button>
          </div>
        </div>
      </div>
    `).join('');
  }

  async function entregar(id) {
    const r = await fetch(`/api/updates/${id}/entregar`, {method:'POST'});
    if (r.ok) { showToast('✅ Marcado como entregue!'); carregarEmBreve(); }
    else showToast('Erro ao entregar', false);
  }

  async function removerItem(id) {
    if (!confirm('Remover este item da fila?')) return;
    const r = await fetch(`/api/updates/${id}`, {method:'DELETE'});
    if (r.ok) { showToast('Item removido.'); carregarEmBreve(); }
    else showToast('Erro ao remover', false);
  }

  // ── Modal ─────────────────────────────────────────────
  function abrirModal() {
    document.getElementById('modal-novo').classList.remove('hidden');
    document.getElementById('f-titulo').focus();
  }
  function fecharModal() {
    document.getElementById('modal-novo').classList.add('hidden');
    ['f-titulo','f-descricao'].forEach(id => document.getElementById(id).value='');
  }
  async function salvarItem() {
    const titulo = document.getElementById('f-titulo').value.trim();
    if (!titulo) { showToast('Título obrigatório', false); return; }
    const payload = {
      titulo,
      descricao:  document.getElementById('f-descricao').value.trim(),
      area:       document.getElementById('f-area').value,
      prioridade: document.getElementById('f-prioridade').value,
      status_dev: document.getElementById('f-status').value,
    };
    const r = await fetch('/api/updates', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if (r.ok) { fecharModal(); showToast('Item adicionado!'); carregarEmBreve(); }
    else showToast('Erro ao salvar', false);
  }
  document.getElementById('modal-novo').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-novo')) fecharModal();
  });

  // ── Init ──────────────────────────────────────────────
  carregarUpdates();
  // badge inicial para Em breve
  fetch('/api/updates?estado=pendente').then(r=>r.json()).then(items=>{
    const b = document.getElementById('badge-pendente');
    if (items.length) { b.textContent=items.length; b.classList.remove('hidden'); }
  });
</script>
{% endblock %}
