{% extends "base.html" %}
{% block content %}

<div class="mb-8">
    <h1 class="text-3xl font-bold text-white flex items-center gap-3">
        <i data-lucide="tv" class="text-blue-500"></i> Gerenciar Séries
        <span class="text-xs bg-blue-600 px-2 py-0.5 rounded-full uppercase tracking-tighter">Beta</span>
    </h1>
    <p class="text-slate-400">Monte a fila de temporadas e baixe a série completa de uma vez.</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

    <!-- Coluna esquerda: montagem das temporadas -->
    <div class="lg:col-span-7 space-y-6">
        <div class="bg-slate-900/60 border border-slate-700/50 p-6 rounded-2xl space-y-5">

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Nome Oficial da Série</label>
                <input type="text" id="sc_serieNome" placeholder="Ex: Manifest"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                <div class="sm:col-span-1">
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">Temporada</label>
                    <input type="number" id="sc_temporada" value="1" min="1"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div class="sm:col-span-3">
                    <label class="block text-xs font-bold text-blue-400 mb-2 uppercase tracking-tight">Pesquisar Episódios</label>
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 w-4 h-4"></i>
                        <input type="text" id="sc_buscarInput" placeholder="Digite o nome do episódio..."
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>
            </div>

            <div id="sc_resultados" class="rounded-xl border border-slate-700 bg-slate-800/80 hidden max-h-64 overflow-y-auto divide-y divide-slate-700/50"></div>

            <div id="sc_eps_preview_wrap" class="hidden">
                <div class="flex justify-between items-center mb-2">
                    <p class="text-xs font-bold text-blue-400 uppercase tracking-tight">Episódios selecionados para esta temporada</p>
                    <button onclick="sc_limparEpsTemp()" class="text-[10px] text-slate-500 hover:text-red-400 uppercase font-bold transition">Limpar</button>
                </div>
                <textarea id="sc_eps_temp" readonly
                    class="w-full h-24 bg-slate-800/60 border border-slate-700 rounded-xl p-3 text-emerald-400 font-mono text-xs resize-none outline-none"></textarea>
            </div>

            <button onclick="sc_adicionarTemporada()"
                class="w-full bg-slate-800 hover:bg-slate-700 border border-blue-500/50 hover:border-blue-500 text-blue-400 font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> ADICIONAR TEMPORADA À FILA
            </button>

        </div>
    </div>

    <!-- Coluna direita: fila de temporadas -->
    <div class="lg:col-span-5">
        <div class="bg-slate-900/60 border border-slate-700/50 rounded-2xl flex flex-col h-full overflow-hidden">
            <div class="p-5 border-b border-slate-700/50 flex justify-between items-center">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <i data-lucide="layers" class="text-blue-400 w-5 h-5"></i> Temporadas na Fila
                </h2>
                <button onclick="sc_limparFila()" class="text-[10px] text-slate-500 hover:text-red-400 uppercase font-bold transition">Limpar Tudo</button>
            </div>

            <div class="p-4 flex-1 overflow-y-auto space-y-3" id="sc_fila_list">
                <p class="text-slate-500 text-sm italic text-center mt-8">Nenhuma temporada na fila ainda...</p>
            </div>

            <div class="p-4 border-t border-slate-700/50">
                <div id="sc_resumo" class="text-xs text-slate-400 mb-3 hidden">
                    <span id="sc_resumo_text"></span>
                </div>
                <button onclick="sc_iniciarDownload()"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="rocket" class="w-5 h-5"></i> BAIXAR SÉRIE COMPLETA
                </button>
            </div>
        </div>
    </div>

</div>

<script>
    let sc_fila = [];
    let sc_timer = null, sc_ctrl = null;

    document.getElementById("sc_buscarInput").addEventListener("input", function() {
        const termo = this.value.trim();
        const box = document.getElementById("sc_resultados");
        if (termo.length < 2) { box.classList.add("hidden"); return; }
        clearTimeout(sc_timer);
        sc_timer = setTimeout(() => {
            if (sc_ctrl) sc_ctrl.abort();
            sc_ctrl = new AbortController();
            fetch("/buscar_series?q=" + encodeURIComponent(termo), { signal: sc_ctrl.signal })
                .then(r => r.json())
                .then(data => sc_renderResultados(data.results || [], box))
                .catch(err => { if (err.name !== "AbortError") console.error(err); });
        }, 300);
    });

    function sc_renderResultados(items, box) {
        if (!items.length) {
            box.innerHTML = "<p class='text-slate-500 text-sm px-4 py-3 text-center italic'>Nenhum resultado encontrado</p>";
            box.classList.remove("hidden"); return;
        }
        box._data = items;
        box.innerHTML = items.map((item, i) => `
            <div onclick="sc_adicionarEp(${i})"
                class="flex items-center gap-3 px-4 py-3 hover:bg-slate-700 cursor-pointer transition group">
                ${item.logo ? `<img src="${item.logo}" class="w-8 h-8 rounded object-cover flex-shrink-0" onerror="this.style.display='none'">` : '<div class="w-8 h-8 rounded bg-slate-700 flex-shrink-0"></div>'}
                <div class="flex-1 min-w-0">
                    <p class="text-white text-sm truncate">${item.name}</p>
                    <p class="text-slate-500 text-xs truncate">${item.group || ''}</p>
                </div>
                <span class="text-blue-400 text-lg font-bold opacity-0 group-hover:opacity-100 transition">+</span>
            </div>
        `).join("");
        box.classList.remove("hidden");
    }

    function sc_adicionarEp(i) {
        const box = document.getElementById("sc_resultados");
        const item = box._data[i];
        const ta = document.getElementById("sc_eps_temp");
        if (ta.value.includes(item.url)) return;
        ta.value += `${item.name}|${item.url}\n`;
        document.getElementById("sc_eps_preview_wrap").classList.remove("hidden");
    }

    function sc_limparEpsTemp() {
        document.getElementById("sc_eps_temp").value = "";
        document.getElementById("sc_eps_preview_wrap").classList.add("hidden");
    }

    function sc_adicionarTemporada() {
        const nome = document.getElementById("sc_serieNome").value.trim();
        const temporada = document.getElementById("sc_temporada").value.trim();
        const raw = document.getElementById("sc_eps_temp").value.trim();
        if (!nome) { alert("Preencha o nome da série."); return; }
        if (!temporada) { alert("Informe o número da temporada."); return; }
        if (!raw) { alert("Selecione pelo menos um episódio."); return; }
        if (sc_fila.find(s => s.season === temporada)) {
            alert(`A Temporada ${temporada} já foi adicionada à fila. Remova-a primeiro se quiser substituir.`); return;
        }
        const episodios = raw.split("\n").filter(l => l.trim()).map(linha => {
            const [name, url] = linha.split("|");
            return { name: name.trim(), url: url.trim() };
        });
        sc_fila.push({ season: temporada, episodes: episodios });
        sc_fila.sort((a, b) => parseInt(a.season) - parseInt(b.season));
        document.getElementById("sc_temporada").value = parseInt(temporada) + 1;
        sc_limparEpsTemp();
        document.getElementById("sc_buscarInput").value = "";
        document.getElementById("sc_resultados").classList.add("hidden");
        sc_renderFila();
    }

    function sc_removerTemporada(season) {
        sc_fila = sc_fila.filter(s => s.season !== season);
        sc_renderFila();
    }

    function sc_renderFila() {
        const list = document.getElementById("sc_fila_list");
        const resumo = document.getElementById("sc_resumo");
        const resumoText = document.getElementById("sc_resumo_text");
        if (!sc_fila.length) {
            list.innerHTML = '<p class="text-slate-500 text-sm italic text-center mt-8">Nenhuma temporada na fila ainda...</p>';
            resumo.classList.add("hidden"); return;
        }
        const totalEps = sc_fila.reduce((acc, s) => acc + s.episodes.length, 0);
        resumoText.textContent = `${sc_fila.length} temporada(s) • ${totalEps} episódio(s) no total`;
        resumo.classList.remove("hidden");
        list.innerHTML = sc_fila.map(s => `
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl px-4 py-3 flex items-center justify-between group">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-sm">T${s.season}</div>
                    <div>
                        <p class="text-white text-sm font-semibold">Temporada ${s.season}</p>
                        <p class="text-slate-400 text-xs">${s.episodes.length} episódio(s)</p>
                    </div>
                </div>
                <button onclick="sc_removerTemporada('${s.season}')" class="text-slate-600 hover:text-red-400 transition opacity-0 group-hover:opacity-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                </button>
            </div>
        `).join('');
    }

    function sc_limparFila() {
        if (!sc_fila.length) return;
        if (confirm("Deseja esvaziar a fila de temporadas?")) { sc_fila = []; sc_renderFila(); }
    }

    function sc_iniciarDownload(force = false) {
        const nome = document.getElementById("sc_serieNome").value.trim();
        if (!nome) { alert("Preencha o nome da série."); return; }
        if (!sc_fila.length) { alert("Adicione pelo menos uma temporada à fila."); return; }
        fetch("/add_serie_completa", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: nome, seasons: sc_fila, force })
        }).then(async res => {
            const data = await res.json();
            if (res.status === 409) { if (confirm(data.message)) sc_iniciarDownload(true); return null; }
            if (!res.ok) { alert(data.message || data.error || "Erro ao adicionar."); return null; }
            return data;
        }).then(data => { if (data) window.location.href = "/downloads"; });
    }

    lucide.createIcons();
</script>

{% endblock %}
