{% extends "base.html" %}
{% block content %}

<div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
        <h1 class="text-3xl font-bold text-white flex items-center gap-3">
            <i data-lucide="bell-ring" class="text-purple-500"></i> Gerenciamento de Webhooks
        </h1>
        <p class="text-slate-400">Configure notificações automáticas para eventos do sistema.</p>
    </div>
    <div class="flex items-center gap-2 bg-purple-500/10 px-3 py-1 rounded-full border border-purple-500/20">
        <span class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></span>
        <span class="text-[10px] font-bold text-purple-500 uppercase">Monitor de Sinais Ativo</span>
    </div>
</div>

<div class="bg-[#111827] border border-slate-800 p-6 rounded-2xl shadow-xl mb-8">
    <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">Adicionar Novo Ponto de Extremidade
        (Endpoint)</h3>
    <div class="flex flex-col md:flex-row gap-4">
        <div class="flex-1">
            <input type="text" id="nome" placeholder="Identificação (Ex: Discord Staff)"
                class="w-full bg-[#0b0f1a] border border-slate-700 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-purple-500 outline-none transition-all">
        </div>
        <div class="flex-[2]">
            <input type="text" id="url" placeholder="https://discord.com/api/webhooks/..."
                class="w-full bg-[#0b0f1a] border border-slate-700 rounded-xl px-4 py-3 text-white font-mono text-xs focus:ring-2 focus:ring-purple-500 outline-none transition-all">
        </div>
        <button
            class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 transition-all shadow-lg shadow-purple-600/20 active:scale-95"
            onclick="criarWebhook()">
            <i data-lucide="plus" class="w-5 h-5"></i> ADICIONAR
        </button>
    </div>
</div>

<div class="bg-[#111827] border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-[#0b0f1a] border-b border-slate-800">
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold">Identificação</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold">Status</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold hidden md:table-cell">
                        Última Execução</th>
                    <th
                        class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold hidden lg:table-cell text-center">
                        Código</th>
                    <th class="p-4 text-xs uppercase tracking-widest text-slate-500 font-bold text-center">Ações</th>
                </tr>
            </thead>
            <tbody id="webhookTable" class="divide-y divide-slate-800 text-sm">
            </tbody>
        </table>
    </div>
</div>

<style>
    .badge {
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    .badge-success {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .badge-error {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .badge-inactive {
        background: rgba(71, 85, 105, 0.1);
        color: #94a3b8;
        border: 1px solid rgba(71, 85, 105, 0.2);
    }

    .btn-action {
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
</style>

<script>
    async function carregarWebhooks() {
        try {
            const res = await fetch("/api/webhooks");
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: `Erro HTTP ${res.status}` }));
                alert("Erro ao listar webhooks: " + (err.error || err.message || "Erro desconhecido."));
                return;
            }
            const data = await res.json();

            const table = document.getElementById("webhookTable");
            table.innerHTML = "";

            data.forEach(hook => {
                let statusBadge = "";

                if (!hook.ativo) {
                    statusBadge = '<span class="badge badge-inactive"><i data-lucide="pause-circle" class="w-3 h-3"></i> Inativo</span>';
                } else if (hook.ultimo_status === "success") {
                    statusBadge = '<span class="badge badge-success"><i data-lucide="check" class="w-3 h-3"></i> Operacional</span>';
                } else if (hook.ultimo_status === "error") {
                    statusBadge = '<span class="badge badge-error"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Falha</span>';
                } else {
                    statusBadge = '<span class="badge badge-inactive">Aguardando Teste</span>';
                }

                const row = document.createElement("tr");
                row.className = "hover:bg-slate-800/30 transition-colors";
                row.innerHTML = `
            <td class="p-4 font-semibold text-white">${hook.nome}</td>
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 hidden md:table-cell text-slate-500 font-mono text-xs italic">${hook.ultima_execucao || "---"}</td>
            <td class="p-4 hidden lg:table-cell text-center">
                <span class="font-mono text-xs ${hook.ultimo_codigo === 200 ? 'text-emerald-500' : 'text-slate-500'}">${hook.ultimo_codigo || "---"}</span>
            </td>
            <td class="p-4">
                <div class="flex items-center justify-center gap-2">
                    <button class="btn-action bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500 hover:text-white border border-emerald-500/20" onclick="testar(${hook.id})">
                        <i data-lucide="send" class="w-3 h-3"></i> Testar
                    </button>
                    <button class="btn-action ${hook.ativo ? 'bg-amber-500/10 text-amber-500 hover:bg-amber-500 border-amber-500/20' : 'bg-blue-500/10 text-blue-500 hover:bg-blue-500 border-blue-500/20'} hover:text-white" onclick="toggle(${hook.id})">
                        <i data-lucide="${hook.ativo ? 'eye-off' : 'eye'}" class="w-3 h-3"></i> ${hook.ativo ? "Pausar" : "Ativar"}
                    </button>
                    <button class="btn-action bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/20" onclick="remover(${hook.id})">
                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                    </button>
                </div>
            </td>
        `;
                table.appendChild(row);
            });
            lucide.createIcons();
        } catch (err) {
            console.error(err);
            alert("Não foi possível carregar os Webhooks do banco de dados.");
        }
    }

    async function criarWebhook() {
        const nome = document.getElementById("nome").value;
        const url = document.getElementById("url").value;

        if (!nome || !url) {
            alert("Preencha o nome e a URL da integração.");
            return;
        }

        try {
            const res = await fetch("/api/webhooks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, url })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: `Erro HTTP ${res.status}` }));
                alert("Erro ao adicionar webhook: " + (err.error || err.message || "Erro desconhecido."));
                return;
            }
        } catch (err) {
            alert("Erro de comunicação com o servidor.");
            return;
        }

        document.getElementById("nome").value = "";
        document.getElementById("url").value = "";

        carregarWebhooks();
    }

    async function testar(id) {
        await fetch(`/api/webhooks/${id}/test`, { method: "POST" });
        carregarWebhooks();
    }

    async function toggle(id) {
        await fetch(`/api/webhooks/${id}/toggle`, { method: "POST" });
        carregarWebhooks();
    }

    async function remover(id) {
        if (!confirm("Deseja remover permanentemente esta integração?")) return;
        await fetch(`/api/webhooks/${id}/delete`, { method: "POST" });
        carregarWebhooks();
    }

    carregarWebhooks();
</script>

{% endblock %}
