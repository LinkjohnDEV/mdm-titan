{% extends "base.html" %}
{% block content %}

<div class="max-w-2xl mx-auto mt-20">
    <div class="bg-amber-500/5 border border-amber-500/20 rounded-2xl p-10 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-500/10 border border-amber-500/30 mb-5">
            <i data-lucide="pause" class="w-8 h-8 text-amber-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">{{ page_name or "Página" }} em pausa</h1>
        <p class="text-slate-400 text-sm">
            Esta seção está temporariamente desativada.<br>
            Volte mais tarde ou use outra página enquanto isso.
        </p>
        <div class="mt-6 flex items-center justify-center gap-3">
            <a href="/dashboard"
                class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
            </a>
            <a href="/filmes"
                class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                <i data-lucide="clapperboard" class="w-4 h-4"></i> Ir pra Filmes
            </a>
        </div>
    </div>
</div>

<script>lucide.createIcons();</script>
{% endblock %}
