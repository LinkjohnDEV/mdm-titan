<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="96" y="52" width="320" height="8" rx="4" fill="url(#blue)" opacity="0.6"/>
  <!-- M letter -->
  <text x="256" y="330" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="300" fill="url(#blue)" text-anchor="middle">M</text>
  <!-- Subtitle -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-weight="700"
        font-size="72" fill="#475569" text-anchor="middle" letter-spacing="16">TITAN</text>
</svg>
